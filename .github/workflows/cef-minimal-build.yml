# CI workflow template for building a minimal libcef distribution.
#
# NOTE: A full Chromium/CEF build requires ~200 GB of free SSD space and
# many hours of CPU time, which exceeds the resources of standard GitHub
# Actions runners. This workflow is designed to run on a self-hosted
# runner provisioned for large builds.
#
# It is triggered MANUALLY only (Actions tab -> "CEF Minimal Build" ->
# "Run workflow"). No automatic triggers (push/pull_request/schedule) are
# defined so it never consumes runner time unless explicitly requested.
name: CEF Minimal Build

on:
  workflow_dispatch:
    inputs:
      cef_branch:
        description: "CEF milestone branch to build (e.g. 6834)"
        required: false
        default: "6834"
        type: string
      runner_labels:
        description: "Comma-separated runner labels (must include 'self-hosted')"
        required: false
        default: "self-hosted,linux,x64,cef-builder"
        type: string

jobs:
  # Pre-flight check: verifies a runner with the requested labels is
  # actually online before starting the (expensive) build job. Without
  # this, GitHub silently queues the build job and eventually cancels it
  # when no matching runner picks it up ("Workflow se canceló solo").
  check-runner:
    runs-on: ${{ github.event.inputs.runner_labels || 'self-hosted,linux,x64,cef-builder' }}
    timeout-minutes: 5
    outputs:
      disk_gb: ${{ steps.disk.outputs.disk_gb }}
    steps:
      - name: Report runner environment
        run: |
          echo "Runner hostname : $(hostname)"
          echo "Runner labels   : ${LABELS_EXPECTED}"
          echo "OS              : $(lsb_release -ds 2>/dev/null || uname -a)"
          echo "CPUs            : $(nproc)"
          echo "Free RAM        : $(free -h | awk '/^Mem:/ {print $7}')"
        env:
          LABELS_EXPECTED: ${{ github.event.inputs.runner_labels }}

      - name: Check free disk space (CEF build needs ~200 GB)
        id: disk
        run: |
          TARGET="$(dirname "$DOWNLOAD_DIR")"
          mkdir -p "$TARGET"
          AVAIL_GB=$(df -BG --output=avail "$TARGET" | tail -1 | tr -dc '0-9')
          echo "disk_gb=$AVAIL_GB" >> "$GITHUB_OUTPUT"
          echo "Free disk on $TARGET: ${AVAIL_GB} GB"
          if [ "$AVAIL_GB" -lt 200 ]; then
            echo "::error::Insufficient disk space (${AVAIL_GB} GB < 200 GB required). The build will very likely fail."
            exit 1
          fi
        env:
          DOWNLOAD_DIR: /opt/cef/chromium_git

  build-minimal-libcef:
    needs: check-runner
    # Runner labels come from the manual trigger input so you can target
    # any self-hosted machine registered in the repo/org settings.
    runs-on: ${{ github.event.inputs.runner_labels || 'self-hosted,linux,x64,cef-builder' }}

    env:
      DOWNLOAD_DIR: /opt/cef/chromium_git
      DEPOT_TOOLS_DIR: /opt/cef/depot_tools

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build prerequisites (Debian/Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 curl unzip pkg-config \
            libglib2.0-dev libnss3 libxss1 libasound2 libatk-bridge2.0-dev \
            libgtk-3-0 libdrm-dev libgbm-dev fonts-liberation

      - name: Build minimal libcef
        timeout-minutes: 720
        run: bash scripts/cef/build-minimal-libcef.sh "${{ github.event.inputs.cef_branch || '6834' }}" "$DOWNLOAD_DIR"

      - name: Upload minimal distribution archive
        uses: actions/upload-artifact@v4
        with:
          name: cef-minimal-linux64
          path: ${{ env.DOWNLOAD_DIR }}/chromium/src/cef/binary_distrib/*minimal*.tar.bz2
          retention-days: 7
