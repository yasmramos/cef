# CI workflow template for building a minimal libcef distribution.
#
# NOTE: A full Chromium/CEF build requires ~200 GB of free SSD space and
# many hours of CPU time, which exceeds the resources of standard GitHub
# Actions runners. This workflow is designed to run on a self-hosted
# runner provisioned for large builds.
#
# It is triggered MANUALLY only (Actions tab -> "CEF Minimal Build" ->
# "Run workflow"). No automatic triggers (push/pull_request/schedule) are
# defined so it never consumes runner time unless explicitly requested.
name: CEF Minimal Build

on:
  workflow_dispatch:
    inputs:
      cef_branch:
        description: "CEF milestone branch to build (e.g. 6834)"
        required: false
        default: "6834"
        type: string
      runner_labels:
        description: "Comma-separated runner labels (must include 'self-hosted')"
        required: false
        default: "self-hosted,linux,x64,cef-builder"
        type: string

env:
  # Single source of truth for the build workspace paths. Overridable at
  # dispatch time if your self-hosted runner uses a different volume.
  DOWNLOAD_DIR: /opt/cef/chromium_git
  DEPOT_TOOLS_DIR: /opt/cef/depot_tools

jobs:
  # Pre-flight check: verifies a runner with the requested labels is
  # actually online before starting the (expensive) build job. Without
  # this, GitHub silently queues the build job and eventually cancels it
  # when no matching runner picks it up ("Workflow se canceló solo").
  check-runner:
    # The input has a YAML-level default, so no `||` fallback expression
    # is needed here (dynamic runs-on expressions with `||` are not
    # reliably evaluated before job scheduling).
    runs-on: ${{ github.event.inputs.runner_labels }}
    timeout-minutes: 5
    outputs:
      disk_gb: ${{ steps.disk.outputs.disk_gb }}
    steps:
      - name: Report runner environment
        run: |
          echo "Runner hostname : $(hostname)"
          echo "Runner labels   : ${LABELS_EXPECTED}"
          echo "OS              : $(lsb_release -ds 2>/dev/null || uname -a)"
          echo "CPUs            : $(nproc)"
          echo "Free RAM        : $(free -h | awk '/^Mem:/ {print $7}')"
        env:
          LABELS_EXPECTED: ${{ github.event.inputs.runner_labels }}

      - name: Check free disk space (CEF build needs ~200 GB)
        id: disk
        run: |
          TARGET="$(dirname "$DOWNLOAD_DIR")"
          sudo mkdir -p "$TARGET"
          sudo chown "$(id -un)" "$TARGET" || true
          AVAIL_GB=$(df -BG --output=avail "$TARGET" | tail -1 | tr -dc '0-9')
          echo "disk_gb=$AVAIL_GB" >> "$GITHUB_OUTPUT"
          echo "Free disk on $TARGET: ${AVAIL_GB} GB"
          if [ "$AVAIL_GB" -lt 200 ]; then
            echo "::error::Insufficient disk space (${AVAIL_GB} GB < 200 GB required). The build will very likely fail."
            exit 1
          fi

      - name: Report available toolchain
        run: |
          for cmd in git python3 curl cmake ninja gclient; do
            if command -v "$cmd" >/dev/null 2>&1; then
              echo "OK   $cmd -> $(command -v $cmd)"
            else
              echo "MISS $cmd"
            fi
          done

  build-minimal-libcef:
    needs: check-runner
    # Runner labels come from the manual trigger input so you can target
    # any self-hosted machine registered in the repo/org settings.
    runs-on: ${{ github.event.inputs.runner_labels }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build prerequisites (Debian/Ubuntu)
        run: |
          sudo apt-get update
          # Build toolchain (cmake/ninja/build-essential are NOT provided by
          # depot_tools and automate-git.py invokes them directly), plus the
          # Chromium runtime dev libs. python-is-python3 provides `python`
          # for legacy CEF scripts that still call it instead of python3.
          sudo apt-get install -y git python3 python-is-python3 curl unzip ca-certificates pkg-config \
            build-essential cmake ninja-build \
            libglib2.0-dev libnss3-dev libxss1 libasound2-dev libatk1.0-dev libatk-bridge2.0-dev \
            libcups2-dev libdrm-dev libgbm-dev libxkbcommon-dev libxcomposite-dev \
            libxdamage-dev libxrandr-dev libpango1.0-dev libgtk-3-dev \
            fonts-liberation xz-utils bison flex gperf
          # Fallback: some distros ship the meta-package as plain "ninja".
          command -v ninja >/dev/null 2>&1 || sudo apt-get install -y ninja-build

      - name: Prepare workspace directories
        run: |
          sudo mkdir -p /opt/cef
          sudo chown "$(id -un):$(id -gn)" /opt/cef
          mkdir -p "$DOWNLOAD_DIR"

      - name: Build minimal libcef
        timeout-minutes: 1440
        env:
          CEF_BRANCH: ${{ github.event.inputs.cef_branch }}
        run: |
          chmod +x scripts/cef/build-minimal-libcef.sh
          bash scripts/cef/build-minimal-libcef.sh "${CEF_BRANCH:-6834}" "$DOWNLOAD_DIR"

      - name: Upload minimal distribution archive
        uses: actions/upload-artifact@v4
        with:
          name: cef-minimal-linux64
          path: ${{ env.DOWNLOAD_DIR }}/chromium/src/cef/binary_distrib/**/*.tar.bz2
          if-no-files-found: error
          retention-days: 7
